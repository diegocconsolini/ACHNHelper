name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Build needs at least these env vars to compile (won't actually call services)
          AUTH_SECRET: dummy-build-secret
          NEXT_PUBLIC_APP_VERSION: ci
